# electron-builder, three platforms, one artifact each.
#
# Signing is deliberately unset: no certificate exists in this repository or in
# CI. macOS builds with `identity: null`, so the dmg is unsigned and not
# notarized; Windows and Linux are unsigned for the same reason. Code signing
# is a follow-up ticket; nothing here reads a secret.
appId: com.gianniacquisto.tandem
productName: Tandem
copyright: Copyright © 2026 Gianni Acquisto
forceCodeSigning: false
asar: true
npmRebuild: false
# The cask links `Contents/MacOS/tandem-cli`; the hook puts the symlink at that
# name so one Rust binary serves both the shell and the agent face.
afterPack: scripts/after-pack.mjs

directories:
  output: dist

files:
  - out/**/*
  - package.json
  # Nothing is loaded from node_modules at runtime: main and preload are
  # bundled, and the renderer carries its React bundle.
  - "!node_modules/**/*"

# The core travels inside the artifact: `scripts/prepare-binary.mjs` builds it
# in release configuration and stages the runner's own name in `build/`, and
# the shell resolves it at `process.resourcesPath/tandem` (`src/main/binary.ts`).
extraResources:
  - from: build
    to: .
    filter:
      - tandem
      - tandem.exe
  # The agent face (ADR 0034): the skills, the four prompts and AGENTS.md ship
  # beside the core, and `tandem-cli setup install` materialises this copy into
  # the Tandem home. `prepare-binary.mjs` writes it from the checkout and stamps
  # VERSION from the app's version.
  - from: build/agent
    to: agent

artifactName: ${productName}-${version}-${os}-${arch}.${ext}

mac:
  category: public.app-category.productivity
  # The brand icon the Swift bundle carried, so the dock and Finder show Tandem
  # rather than Electron's default.
  icon: ../Resources/AppIcon.icns
  target:
    - target: dmg
    - target: zip
  # The tap's cask downloads
  # `releases/download/v#{version}/Tandem-#{version}.zip` and
  # `Scripts/bump-tap.sh` reads `Tandem-<version>.zip` out of SHA256SUMS, so
  # the zip's name is a contract, not a preference. The dmg keeps the same
  # stem and only the cask's archive matters to the bump.
  artifactName: ${productName}-${version}.${ext}
  identity: null

win:
  target:
    - target: nsis

linux:
  category: Utility
  target:
    - target: AppImage
