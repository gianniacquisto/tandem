name: Release

# The repo's first CI. A tag v* push (or a manual dispatch) on a GitHub-hosted
# macOS 27 runner (`xcode-27`) builds and verifies the artifact and then
# publishes the GitHub release; pull-request runs do the same build-and-verify
# work and upload the artifact, never publishing. The contract is this file
# and `docs/releasing.md`; ADR 0003 owns the distribution model it serves (one
# prebuilt cask, its artifact built by CI on each tag).
#
# The stages are the test seam: the run fails if the test suite fails, the
# README's CLI grammar block drifts from `Usage.swift`, the build fails, the
# signature does not verify, the Info.plist version does not match the tag,
# the in-bundle CLI fails its --help / no-argument exit-code assertions, or
# the zip does not contain an intact app.
#
# The work is split in three: `test` (the gates) and `build` (the artifact) run
# in parallel, each on its own runner, and `release` aggregates them. The
# aggregator keeps the name `release` for one reason: `dev` and `main` require
# a status check by that name, and a required check that never reports blocks
# every merge — so the split renames nothing, the branch protection is
# untouched, and the merge still waits for both halves, because the aggregator
# publishes only when both are green.

on:
  push:
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

# Least privilege by default: the two heavy jobs only read the repo. The
# publish step needs `contents: write`, and only the `release` job gets it.
permissions:
  contents: read

jobs:
  test:
    # The gates. The floor is macOS 27 (Apple silicon); the build needs SDK 27.
    # `xcode-27` is the GitHub-hosted public-preview image: macOS 27.0.1 /
    # Xcode 27 / macosx27.0 SDK / Node 24 — the target toolchain, no self-hosted
    # runner to keep online. `macos-27` is NOT a hosted label (Homebrew's
    # :golden_gate naming; a run pinned to it queues forever), and the macOS 26
    # images ship Xcode 26 / SDK 26, so they cannot build a `.macOS(.v27)`
    # package. The few-core preview runner needs the serialized test gate below.
    runs-on: xcode-27
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Check out the source
        uses: actions/checkout@v4

      - name: "Gate: run the package test suite"
        run: |
          # Serialized (`--no-parallel`): Swift Testing runs tests in parallel by
          # default (`--no-parallel` is the XCTest default only), and on the
          # few-core hosted xcode-27 runner the CPU-heavy suites starve the
          # DispatchQueue pool the contention tests use — their helper threads
          # miss even the widened 15 s waits, so the gate fails on load, not on
          # behaviour. Serial execution removes that artificial contention; each
          # test's own threads still exercise the lock. (The self-hosted 10-core
          # Mac had the headroom for the default parallel run.)
          swift test --no-parallel

      - name: "Gate: the README's CLI grammar matches Usage.swift"
        run: |
          # The README's grammar block is a hand-copy of `Usage.text`, and a
          # hand-copy drifts — review gates caught it twice (the deprecated
          # `todo` verb taught, `[--archived]` dropped, the `session` group
          # missing) before this check existed. The script makes the drift a
          # red run: every grammar entry the source carries must appear in the
          # block, in order, and the block may not carry an entry the source
          # does not have.
          Scripts/check-readme-grammar.sh

      - name: "Gate: editor bundle tests + reproducible build"
        run: |
          # The editor bundle is committed prebuilt (`Editor/build.mjs` states
          # the rule: the pinned inputs must regenerate the committed bytes
          # exactly): its tests run on the pinned deps, and the committed bytes
          # must be exactly what the pinned inputs regenerate — a non-empty diff
          # after the rebuild is a manual edit or a source/lockfile drift.
          cd Editor
          npm ci
          # `node --test` with no path (auto-discovery): the hosted image's Node
          # 24 rejects a directory positional (`node --test test/` →
          # "Cannot find module …/Editor/test"); bare `--test` discovers the same
          # 169 tests on Node 24 and 26.
          node --test
          npm run build
          cd ..
          git diff --exit-code -- Sources/Tandem/Resources/Editor

  build:
    # The artifact. The same runner and the same floor as the gates, and the
    # same build as before the split: both products in release configuration,
    # the bundle assembled and verified, the zip uploaded. The aggregator
    # rebuilds nothing, so the published bytes are the bytes this job verified.
    runs-on: xcode-27
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Check out the source
        uses: actions/checkout@v4

      - name: Resolve the version
        run: |
          # Tag runs: the version is the tag with the leading v stripped.
          # PR / dispatch runs: a fixed dev version (never published).
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          else
            echo "version=0.0.0" >> "$GITHUB_ENV"
          fi

      - name: Build both products (release configuration)
        run: |
          swift build -c release --product Tandem
          swift build -c release --product tandem-cli

      - name: Assemble the app bundle
        run: Scripts/make-app-bundle.sh .build/release/Tandem .build/release/tandem-cli "$version" dist

      - name: "Verify: bundle structure"
        run: |
          app=dist/Tandem.app
          test -x "$app/Contents/MacOS/Tandem"
          test -x "$app/Contents/MacOS/tandem-cli"
          test -f "$app/Contents/Info.plist"
          test -f "$app/Contents/Resources/AppIcon.icns"
          editor="$app/Contents/Resources/tandem_Tandem.bundle/Contents/Resources/Editor"
          test -f "$app/Contents/Resources/NOTICE.txt"
          test -f "$editor/index.html"
          test -f "$editor/editor.js"
          test -f "$editor/style.css"
          test -d "$editor/fonts"
          test -f "$editor/LICENSES.md"

      - name: "Verify: ad-hoc signature"
        run: codesign --verify --strict dist/Tandem.app

      - name: "Verify: Info.plist version matches the tag"
        run: |
          actual=$(plutil -extract CFBundleShortVersionString raw dist/Tandem.app/Contents/Info.plist)
          if [[ "$actual" != "$version" ]]; then
            echo "::error::Info.plist version '$actual' does not match the expected version '$version'"
            exit 1
          fi

      - name: "Verify: Info.plist floor matches the binaries"
        run: |
          # A plist floor below the binaries' deployment target admits an
          # install the binaries cannot load, through both Gatekeeper and brew:
          # `brew bump` derives the cask's `depends_on macos:` from this value,
          # so a stale plist silently lowers the cask floor (2026-10-17: the
          # plist said 26.0 while both binaries' LC_BUILD_VERSION minos was
          # 27.0, and the 0.6.0 bump PR moved the cask to :tahoe/macOS 26).
          # Compare the plist against each binary's minos, major component only.
          app=dist/Tandem.app
          plist_floor=$(plutil -extract LSMinimumSystemVersion raw "$app/Contents/Info.plist")
          failed=0
          for bin in Tandem tandem-cli; do
            minos=$(otool -l "$app/Contents/MacOS/$bin" | awk '/LC_BUILD_VERSION/{f=1} f && $1 == "minos"{print $2; exit}')
            if [[ "${plist_floor%%.*}" != "${minos%%.*}" ]]; then
              echo "::error::$bin is built for macOS $minos but Info.plist LSMinimumSystemVersion is $plist_floor"
              failed=1
            fi
          done
          exit $failed

      - name: "Verify: in-bundle CLI help and no-argument exit codes"
        run: |
          # tandem-cli replaces the retired MCP server (ADR 0009). --help prints
          # usage to stdout and exits 0; no arguments prints usage to stderr and
          # exits 2. (The old formula's stdin-EOF smoke retired with the server.)
          cli=dist/Tandem.app/Contents/MacOS/tandem-cli
          "$cli" --help >/dev/null
          code=0
          "$cli" </dev/null >/dev/null 2>/dev/null || code=$?
          if [[ "$code" -ne 2 ]]; then
            echo "::error::tandem-cli with no arguments exited $code, expected 2"
            exit 1
          fi

      - name: Zip the artifact and compute the checksum
        run: |
          cd dist
          zip -rX "Tandem-$version.zip" Tandem.app
          shasum -a 256 "Tandem-$version.zip" > SHA256SUMS
          cat SHA256SUMS

      - name: "Verify: the zip contains an intact app"
        run: |
          mkdir "$RUNNER_TEMP/zipcheck"
          unzip -q "dist/Tandem-$version.zip" -d "$RUNNER_TEMP/zipcheck"
          app="$RUNNER_TEMP/zipcheck/Tandem.app"
          test -x "$app/Contents/MacOS/Tandem"
          test -x "$app/Contents/MacOS/tandem-cli"
          codesign --verify --strict "$app"

      - name: Upload the artifact
        uses: actions/upload-artifact@v4
        with:
          name: Tandem-${{ env.version }}
          path: |
            dist/Tandem-${{ env.version }}.zip
            dist/SHA256SUMS

  release:
    # The aggregator, and the name the branch protection requires. It runs
    # after both halves, so the merge still waits for the gates and for the
    # build: a release is still published only from a run whose tests passed.
    #
    # `!cancelled()` (GitHub's own pattern for "run me whatever the
    # dependencies did") rather than the default `success()`: a job skipped
    # because a dependency failed reports "Success" to the branch protection
    # (skipped is a passing status), so the required check would read as green
    # on a red test run. This job runs instead, and the step below turns a red
    # half into a red `release` — the check the protection watches fails, as
    # it did before the split.
    needs: [test, build]
    if: ${{ !cancelled() }}
    runs-on: xcode-27
    timeout-minutes: 15
    permissions:
      contents: write # needed by the publish step (gh release); no other job has it
    steps:
      - name: "Verify: both halves are green"
        env:
          TEST_RESULT: ${{ needs.test.result }}
          BUILD_RESULT: ${{ needs.build.result }}
        run: |
          if [[ "$TEST_RESULT" != "success" || "$BUILD_RESULT" != "success" ]]; then
            echo "::error::the release aggregator needs both halves green (test: $TEST_RESULT, build: $BUILD_RESULT)"
            exit 1
          fi

      - name: Check out the source
        uses: actions/checkout@v4
        with:
          # The release-body generator (Scripts/release-notes.sh) walks the
          # tags and the merge history between them; the default shallow,
          # no-tags fetch has neither.
          fetch-depth: 0

      - name: Resolve the version
        run: |
          # The same rule as the build job: the artifact is named after the
          # version, and the two jobs must agree on which artifact to hand over.
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          else
            echo "version=0.0.0" >> "$GITHUB_ENV"
          fi

      - name: Download the artifact
        uses: actions/download-artifact@v4
        with:
          name: Tandem-${{ env.version }}
          path: dist

      - name: "Verify: the downloaded zip matches SHA256SUMS"
        run: |
          # The handoff between the two jobs is the only new thing in the
          # pipeline, so it is checked: the checksum the build job wrote must be
          # the checksum of the bytes the aggregator is about to publish.
          cd dist
          shasum -a 256 -c SHA256SUMS

      - name: Publish the GitHub release (tag runs only)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Idempotent re-cut of the same tag (user story 14): this gh build
          # (2.102.0) has no --clobber on `release create`, so an existing
          # release for the tag is deleted first, then recreated with the
          # current assets.
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release delete "$GITHUB_REF_NAME" --yes
          fi
          # The body carries what shipped (7B005267), grouped by kind
          # (BCE67BAE), not a fixed tag line: the generator lists the PRs
          # merged on dev since the previous tag (titles and labels via gh,
          # the fixed install line as the lead), never writing the bikeshed —
          # that is `--capture`, a local step this runner cannot take.
          notes=$(Scripts/release-notes.sh "$GITHUB_REF_NAME")
          gh release create "$GITHUB_REF_NAME" \
            --title "Tandem $version" \
            --notes "$notes" \
            "dist/Tandem-$version.zip" dist/SHA256SUMS
