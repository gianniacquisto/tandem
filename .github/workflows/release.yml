name: Release

# The tag run, cargo only: five standalone `tandem` archives, verified on the
# platform that built them, then published with `install.sh` and one
# `SHA256SUMS`. `Scripts/install.sh` downloads an archive, verifies its digest
# and installs the one binary; there is no Node toolchain, no Electron package
# and no Homebrew tap in the path (CUT-16, ADR 0045).
#
# Pull-request runs build and verify the same five archives and never
# publish, so a packaging change is a red check on the PR instead of a broken
# tag. They do it unless the PR touches only the allowlist `Resources/` and
# `LICENSE` (CUT-32; an allowlist of what may skip, since some gates read the
# whole tracked tree). Every job still runs and reports its name, with its
# steps skipped on such a PR, because a skipped matrix job reports under its
# unexpanded name and a required check that never reports blocks the merge.
# Tags and dispatches always run everything. The five builds are one matrix
# job: a new target is one row. The publisher keeps the job name `release`:
# `main` requires a status check by that name, and a required check that never
# reports blocks every merge. It waits for the build matrix, and its step
# turns a skipped or failed build into a red `release` (a skipped job reports
# success to the branch protection).
#
# The version is the tag without its `v`, or `0.0.0` on a pull request or a
# dispatch. It is stamped into the binary as `TANDEM_VERSION`, so the archive's
# own smoke test reads the same version back from `tandem --version`.
#
# Every action is pinned to a full commit SHA with its version in a comment;
# Dependabot keeps them current. `actions/cache` is GitHub's own, behind the
# local `rust-setup` action. This workflow has no `main` trigger, so each build
# uses the combined cache step: a PR's later pushes hit its own PR-scoped entry,
# and a tag run restores from `main` or its own scope. The tag run still
# rebuilds, since it stamps its own version.

on:
  push:
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

# Least privilege by default: the build jobs only read the repo. The `release`
# job needs `contents: write` for `gh release create`, and no other job gets it.
permissions:
  contents: read

# A superseded pull-request run is cancelled; tag runs and dispatches never are.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - name: Check out the merge commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2

      - name: Did the change touch what the build reads?
        id: filter
        run: echo "code=$(bash Scripts/changed-paths.sh Resources/ LICENSE)" >> "$GITHUB_OUTPUT"

  build:
    name: build (${{ matrix.target }})
    needs: changes
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: darwin-arm64
            ext: tar.gz
            artifact: macos
            triple: ""
          - os: macos-latest
            target: darwin-x86_64
            ext: tar.gz
            artifact: macos-x86_64
            triple: x86_64-apple-darwin
          - os: ubuntu-latest
            target: linux-x86_64
            ext: tar.gz
            artifact: linux
            triple: x86_64-unknown-linux-musl
          - os: ubuntu-24.04-arm
            target: linux-arm64
            ext: tar.gz
            artifact: linux-arm64
            triple: aarch64-unknown-linux-musl
          - os: windows-latest
            target: windows-x86_64
            ext: zip
            artifact: windows
            triple: ""
    steps:
      - name: Check out the source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up the Rust toolchain and cache
        uses: ./.github/actions/rust-setup
        with:
          enabled: ${{ needs.changes.outputs.code }}
          key: build-${{ matrix.artifact }}-release
          save: "true"

      - name: Resolve the version
        if: needs.changes.outputs.code != 'false'
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          else
            echo "version=0.0.0" >> "$GITHUB_ENV"
          fi

      - name: Add the cross target and the musl linker
        if: needs.changes.outputs.code != 'false' && matrix.triple != ''
        shell: bash
        working-directory: rust
        run: |
          rustup target add "${{ matrix.triple }}"
          # Static Linux: musl-gcc is the C compiler for rusqlite's bundled SQLite.
          if [[ "${{ matrix.triple }}" == *-linux-musl ]]; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq musl-tools
          fi

      - name: Build the binary
        if: needs.changes.outputs.code != 'false'
        shell: bash
        working-directory: rust
        run: |
          if [ -n "${{ matrix.triple }}" ]; then
            TANDEM_VERSION="$version" cargo build --release -p tandem --target "${{ matrix.triple }}"
            echo "bindir=rust/target/${{ matrix.triple }}/release" >> "$GITHUB_ENV"
          else
            TANDEM_VERSION="$version" cargo build --release -p tandem
            echo "bindir=rust/target/release" >> "$GITHUB_ENV"
          fi

      - name: "Verify: the Linux binary is static"
        if: needs.changes.outputs.code != 'false' && contains(matrix.triple, 'linux-musl')
        run: |
          file "$bindir/tandem"
          if ldd "$bindir/tandem" 2>&1 | grep -qv "not a dynamic executable\|statically linked"; then
            echo "::error::the musl binary is dynamically linked"
            exit 1
          fi

      - name: Package the archive (tar.gz)
        if: needs.changes.outputs.code != 'false' && matrix.ext == 'tar.gz'
        run: |
          archive="tandem-$version-${{ matrix.target }}.tar.gz"
          staging="$RUNNER_TEMP/package"
          mkdir -p "$staging" dist
          cp "$bindir/tandem" "$staging/tandem"
          chmod +x "$staging/tandem"
          cp LICENSE NOTICE.txt "$staging/"
          tar -czf "dist/$archive" -C "$staging" tandem LICENSE NOTICE.txt
          listing="$(tar -tzf "dist/$archive")"
          echo "$listing"
          for member in tandem LICENSE NOTICE.txt; do
            if ! echo "$listing" | grep -qx "$member"; then
              echo "::error::the archive lacks $member"
              exit 1
            fi
          done

      - name: Package the archive (zip)
        if: needs.changes.outputs.code != 'false' && matrix.ext == 'zip'
        shell: pwsh
        run: |
          $archive = "tandem-$env:version-${{ matrix.target }}.zip"
          New-Item -ItemType Directory -Force -Path dist, "$env:RUNNER_TEMP\package" | Out-Null
          Copy-Item "$env:bindir\tandem.exe" "$env:RUNNER_TEMP\package\tandem.exe"
          Copy-Item LICENSE, NOTICE.txt "$env:RUNNER_TEMP\package\"
          Compress-Archive -Path "$env:RUNNER_TEMP\package\tandem.exe", "$env:RUNNER_TEMP\package\LICENSE", "$env:RUNNER_TEMP\package\NOTICE.txt" -DestinationPath "dist\$archive"
          Get-ChildItem dist
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $zip = [System.IO.Compression.ZipFile]::OpenRead((Resolve-Path "dist\$archive"))
          $names = $zip.Entries | ForEach-Object { $_.FullName }
          $zip.Dispose()
          $names
          foreach ($member in "tandem.exe", "LICENSE", "NOTICE.txt") {
            if ($names -notcontains $member) {
              Write-Output "::error::the archive lacks $member"
              exit 1
            }
          }

      - name: "Smoke: the extracted tar.gz archive serves the board"
        if: needs.changes.outputs.code != 'false' && matrix.ext == 'tar.gz'
        run: |
          # Smoke the bytes the tag publishes, not the build tree: untar the
          # archive just written and run the binary a user would get. A wrong
          # member name, a lost executable bit or a mislaid layout fails here
          # rather than on someone's first install.
          smoke="$RUNNER_TEMP/smoke"
          mkdir -p "$smoke"
          tar -xzf "dist/tandem-$version-${{ matrix.target }}.tar.gz" -C "$smoke"
          test -x "$smoke/tandem"
          if [ "${{ matrix.target }}" = darwin-x86_64 ]; then
            if arch -x86_64 /usr/bin/true 2>/dev/null; then
              echo "darwin-x86_64: Rosetta is available, running the full smoke under it"
              arch -x86_64 bash Scripts/smoke-binary.sh "$smoke/tandem" "$version"
            else
              echo "darwin-x86_64: no Rosetta on this runner, smoking --version only"
              printed=$("$smoke/tandem" --version)
              case "$printed" in
                *"$version"*) echo "--version printed '$printed'" ;;
                *) echo "::error::--version printed '$printed', not $version"; exit 1 ;;
              esac
            fi
          else
            bash Scripts/smoke-binary.sh "$smoke/tandem" "$version"
          fi

      - name: "Smoke: the extracted zip archive serves the board"
        if: needs.changes.outputs.code != 'false' && matrix.ext == 'zip'
        shell: pwsh
        run: ./Scripts/smoke-binary.ps1 -Archive "dist\tandem-$($env:version)-${{ matrix.target }}.zip" -Version $env:version

      - name: "Test: install.ps1 installs the zip just built (Windows PowerShell 5.1)"
        if: needs.changes.outputs.code != 'false' && matrix.ext == 'zip'
        # `shell: powershell` is Windows PowerShell 5.1, what a stock Windows
        # user runs; the suite starts the installer in a child powershell.exe.
        shell: powershell
        run: ./Scripts/test_install.ps1 -Archive "dist\tandem-$($env:version)-${{ matrix.target }}.zip" -Version $env:version

      - name: Upload the archive
        if: needs.changes.outputs.code != 'false'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tandem-${{ matrix.artifact }}
          path: dist

  release:
    name: release
    # The required check's name. It runs after the builds, so a release is
    # published only from a run whose five archives were verified.
    needs: [changes, build]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write # `gh release create`; no other job has it
      id-token: write # the attestation's signing identity; this job only
      attestations: write # `actions/attest-build-provenance`; this job only
    steps:
      - name: "Verify: the builds are green"
        env:
          BUILD_RESULT: ${{ needs.build.result }}
        run: |
          if [ "$BUILD_RESULT" != "success" ]; then
            echo "::error::the release aggregator needs the build green (build: $BUILD_RESULT)"
            exit 1
          fi

      - name: Check out the source
        if: needs.changes.outputs.code != 'false'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The release-body generator (Scripts/release-notes.sh) walks the tags
          # and the merge history between them; the default shallow, no-tags
          # fetch has neither.
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve the version
        if: needs.changes.outputs.code != 'false'
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          else
            echo "version=0.0.0" >> "$GITHUB_ENV"
          fi

      - name: Download the five archives
        if: needs.changes.outputs.code != 'false'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: tandem-*
          merge-multiple: true
          path: dist

      - name: "Verify: the five platform archives are present"
        if: needs.changes.outputs.code != 'false'
        run: |
          test -f "dist/tandem-$version-darwin-arm64.tar.gz"
          test -f "dist/tandem-$version-darwin-x86_64.tar.gz"
          test -f "dist/tandem-$version-linux-x86_64.tar.gz"
          test -f "dist/tandem-$version-linux-arm64.tar.gz"
          test -f "dist/tandem-$version-windows-x86_64.zip"
          ls -l dist

      - name: Stage install.sh, install.ps1 and SHA256SUMS
        if: needs.changes.outputs.code != 'false'
        run: |
          Scripts/stage-release-assets.sh "$version" dist
          cat dist/SHA256SUMS

      - name: "Verify: the staged manifest checks out"
        if: needs.changes.outputs.code != 'false'
        run: |
          cd dist
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum -c SHA256SUMS
          else
            shasum -a 256 -c SHA256SUMS
          fi
          grep -q "DEFAULT_VERSION=\"$version\"" install.sh
          grep -q "\$DefaultVersion = \"$version\"" install.ps1

      - name: Attest the archives' provenance (tag runs only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        with:
          subject-path: |
            dist/tandem-${{ env.version }}-darwin-arm64.tar.gz
            dist/tandem-${{ env.version }}-darwin-x86_64.tar.gz
            dist/tandem-${{ env.version }}-linux-x86_64.tar.gz
            dist/tandem-${{ env.version }}-linux-arm64.tar.gz
            dist/tandem-${{ env.version }}-windows-x86_64.zip

      - name: Publish the GitHub release (tag runs only)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Idempotent re-cut of the same tag, and the release is present at
          # every moment: create it when absent, else overwrite the assets in
          # place (`upload --clobber`) and rewrite the notes (`edit`). The old
          # delete-then-create left `releases/latest/download/install.sh` a 404
          # between the two calls, and no release at all if the create failed.
          notes=$(Scripts/release-notes.sh "$GITHUB_REF_NAME")
          assets=(
            "dist/tandem-$version-darwin-arm64.tar.gz"
            "dist/tandem-$version-darwin-x86_64.tar.gz"
            "dist/tandem-$version-linux-x86_64.tar.gz"
            "dist/tandem-$version-linux-arm64.tar.gz"
            "dist/tandem-$version-windows-x86_64.zip"
            dist/install.sh dist/install.ps1 dist/SHA256SUMS
          )
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "${assets[@]}" --clobber
            gh release edit "$GITHUB_REF_NAME" --title "Tandem $version" --notes "$notes"
          else
            gh release create "$GITHUB_REF_NAME" \
              --title "Tandem $version" \
              --notes "$notes" \
              "${assets[@]}"
          fi
