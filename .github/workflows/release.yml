name: Release

# The tag run, cargo only: three standalone `tandem` archives, verified on the
# platform that built them, then published with `install.sh` and one
# `SHA256SUMS`. `Scripts/install.sh` downloads an archive, verifies its digest
# and installs the one binary; there is no Node toolchain, no Electron package
# and no Homebrew tap in the path (CUT-16, ADR 0045).
#
# Pull-request runs build and verify the same three archives and never publish,
# so a packaging change is a red check on the PR instead of a broken tag. The
# publisher keeps the job name `release`: `main` requires a status check by that
# name, and a required check that never reports blocks every merge. It waits for
# all three builds, and its step turns a skipped or failed build into a red
# `release` (a skipped job reports success to the branch protection).
#
# The version is the tag without its `v`, or `0.0.0` on a pull request or a
# dispatch. It is stamped into the binary as `TANDEM_VERSION`, so the archive's
# own smoke test reads the same version back from `tandem --version`.
#
# No third-party action: `actions/cache` is GitHub's own. This workflow has no
# `main` trigger, so each build uses the combined cache step: a PR's later
# pushes hit its own PR-scoped entry, and a tag run restores from `main` or its
# own scope. The tag run still rebuilds, since it stamps its own version.

on:
  push:
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

# Least privilege by default: the build jobs only read the repo. The `release`
# job needs `contents: write` for `gh release create`, and no other job gets it.
permissions:
  contents: read

# A superseded pull-request run is cancelled; tag runs and dispatches never are.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-macos:
    name: build-macos
    runs-on: macos-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Check out the source
        uses: actions/checkout@v4

      - name: Warm the Rust toolchain
        working-directory: rust
        run: cargo --version

      - name: Resolve the toolchain pin
        id: toolchain
        shell: bash
        run: echo "channel=$(sed -n 's/^channel *= *"\(.*\)"/\1/p' rust/rust-toolchain.toml)" >> "$GITHUB_OUTPUT"

      - name: Cache cargo and target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            rust/target
          key: ${{ runner.os }}-build-macos-release-${{ steps.toolchain.outputs.channel }}-${{ hashFiles('rust/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-build-macos-release-${{ steps.toolchain.outputs.channel }}-

      - name: Resolve the version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          else
            echo "version=0.0.0" >> "$GITHUB_ENV"
          fi

      - name: Build the binary
        working-directory: rust
        run: TANDEM_VERSION="$version" cargo build --release -p tandem

      - name: Package the archive
        run: |
          archive="tandem-$version-darwin-arm64.tar.gz"
          staging="$RUNNER_TEMP/package"
          mkdir -p "$staging" dist
          cp rust/target/release/tandem "$staging/tandem"
          chmod +x "$staging/tandem"
          tar -czf "dist/$archive" -C "$staging" tandem
          tar -tzf "dist/$archive"

      - name: "Smoke: the extracted archive serves the board"
        run: |
          # Smoke the bytes the tag publishes, not the build tree: untar the
          # archive just written and run the binary a user would get. A wrong
          # member name, a lost executable bit or a mislaid layout fails here
          # rather than on someone's first install.
          smoke="$RUNNER_TEMP/smoke"
          mkdir -p "$smoke"
          tar -xzf "dist/tandem-$version-darwin-arm64.tar.gz" -C "$smoke"
          test -x "$smoke/tandem"
          bash Scripts/smoke-binary.sh "$smoke/tandem" "$version"

      - name: Upload the archive
        uses: actions/upload-artifact@v4
        with:
          name: tandem-macos
          path: dist

  build-linux:
    name: build-linux
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Check out the source
        uses: actions/checkout@v4

      - name: Warm the Rust toolchain
        working-directory: rust
        run: cargo --version

      - name: Resolve the toolchain pin
        id: toolchain
        shell: bash
        run: echo "channel=$(sed -n 's/^channel *= *"\(.*\)"/\1/p' rust/rust-toolchain.toml)" >> "$GITHUB_OUTPUT"

      - name: Cache cargo and target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            rust/target
          key: ${{ runner.os }}-build-linux-release-${{ steps.toolchain.outputs.channel }}-${{ hashFiles('rust/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-build-linux-release-${{ steps.toolchain.outputs.channel }}-

      - name: Resolve the version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          else
            echo "version=0.0.0" >> "$GITHUB_ENV"
          fi

      - name: Build the binary
        working-directory: rust
        run: TANDEM_VERSION="$version" cargo build --release -p tandem

      - name: Package the archive
        run: |
          archive="tandem-$version-linux-x86_64.tar.gz"
          staging="$RUNNER_TEMP/package"
          mkdir -p "$staging" dist
          cp rust/target/release/tandem "$staging/tandem"
          chmod +x "$staging/tandem"
          tar -czf "dist/$archive" -C "$staging" tandem
          tar -tzf "dist/$archive"

      - name: "Smoke: the extracted archive serves the board"
        run: |
          # Same as `build-macos`: the smoke runs the binary the archive
          # carries, so the Linux package is verified as shipped.
          smoke="$RUNNER_TEMP/smoke"
          mkdir -p "$smoke"
          tar -xzf "dist/tandem-$version-linux-x86_64.tar.gz" -C "$smoke"
          test -x "$smoke/tandem"
          bash Scripts/smoke-binary.sh "$smoke/tandem" "$version"

      - name: Upload the archive
        uses: actions/upload-artifact@v4
        with:
          name: tandem-linux
          path: dist

  build-windows:
    name: build-windows
    runs-on: windows-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Check out the source
        uses: actions/checkout@v4

      - name: Warm the Rust toolchain
        working-directory: rust
        run: cargo --version

      - name: Resolve the toolchain pin
        id: toolchain
        shell: bash
        run: echo "channel=$(sed -n 's/^channel *= *"\(.*\)"/\1/p' rust/rust-toolchain.toml)" >> "$GITHUB_OUTPUT"

      - name: Cache cargo and target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            rust/target
          key: ${{ runner.os }}-build-windows-release-${{ steps.toolchain.outputs.channel }}-${{ hashFiles('rust/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-build-windows-release-${{ steps.toolchain.outputs.channel }}-

      - name: Resolve the version
        shell: pwsh
        run: |
          if ($env:GITHUB_REF -like 'refs/tags/v*') {
            $version = $env:GITHUB_REF_NAME.Substring(1)
          } else {
            $version = '0.0.0'
          }
          "version=$version" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Build the binary
        working-directory: rust
        shell: pwsh
        run: |
          $env:TANDEM_VERSION = $env:version
          cargo build --release -p tandem

      - name: Package the archive
        shell: pwsh
        run: |
          $archive = "tandem-$env:version-windows-x86_64.zip"
          New-Item -ItemType Directory -Force -Path dist, "$env:RUNNER_TEMP\package" | Out-Null
          Copy-Item rust\target\release\tandem.exe "$env:RUNNER_TEMP\package\tandem.exe"
          Compress-Archive -Path "$env:RUNNER_TEMP\package\tandem.exe" -DestinationPath "dist\$archive"
          Get-ChildItem dist

      - name: "Smoke: the extracted archive serves the board"
        shell: pwsh
        run: |
          # Extract the zip first: the smoke runs the executable the archive
          # carries, so a member-name or layout change fails the build.
          $smoke = Join-Path $env:RUNNER_TEMP 'smoke'
          New-Item -ItemType Directory -Force -Path $smoke | Out-Null
          Expand-Archive -Path "dist\tandem-$($env:version)-windows-x86_64.zip" -DestinationPath $smoke -Force
          $exe = (Resolve-Path (Join-Path $smoke 'tandem.exe')).Path
          $printed = & $exe --version
          if ($printed -notmatch [regex]::Escape($env:version)) {
            throw "tandem --version did not name $env:version"
          }
          $smokeHome = Join-Path $env:RUNNER_TEMP 'smoke-home'
          New-Item -ItemType Directory -Force -Path $smokeHome | Out-Null
          $out = Join-Path $env:RUNNER_TEMP 'serve.log'
          $err = Join-Path $env:RUNNER_TEMP 'serve.err'
          $process = Start-Process -FilePath $exe `
            -ArgumentList @('serve', '--port', '0', '--home', $smokeHome) `
            -RedirectStandardOutput $out -RedirectStandardError $err -PassThru -NoNewWindow
          $address = $null
          for ($i = 0; $i -lt 150; $i++) {
            Start-Sleep -Milliseconds 100
            if (Test-Path $out) {
              $match = Select-String -Path $out -Pattern 'http://[0-9.]+:[0-9]+' -ErrorAction SilentlyContinue |
                Select-Object -First 1
              if ($match) { $address = $match.Matches[0].Value; break }
            }
            if ($process.HasExited) { throw "the server exited before it listened" }
          }
          if (-not $address) { throw "the server did not print its address" }
          foreach ($path in @('/', '/notes')) {
            $response = Invoke-WebRequest -Uri "$address$path" -UseBasicParsing
            if ($response.StatusCode -ne 200) { throw "$path answered $($response.StatusCode)" }
            if (-not $response.Headers['Content-Security-Policy']) { throw "$path carries no Content-Security-Policy" }
          }
          Stop-Process -Id $process.Id -Force

      - name: Upload the archive
        uses: actions/upload-artifact@v4
        with:
          name: tandem-windows
          path: dist

  release:
    name: release
    # The required check's name. It runs after the builds, so a release is
    # published only from a run whose three archives were verified.
    needs: [build-macos, build-linux, build-windows]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write # `gh release create`; no other job has it
    steps:
      - name: "Verify: the builds are green"
        env:
          BUILD_MACOS_RESULT: ${{ needs['build-macos'].result }}
          BUILD_LINUX_RESULT: ${{ needs['build-linux'].result }}
          BUILD_WINDOWS_RESULT: ${{ needs['build-windows'].result }}
        run: |
          if [ "$BUILD_MACOS_RESULT" != "success" ]; then
            echo "::error::the release aggregator needs the build green (build-macos: $BUILD_MACOS_RESULT)"
            exit 1
          fi
          if [ "$BUILD_LINUX_RESULT" != "success" ]; then
            echo "::error::the release aggregator needs the build green (build-linux: $BUILD_LINUX_RESULT)"
            exit 1
          fi
          if [ "$BUILD_WINDOWS_RESULT" != "success" ]; then
            echo "::error::the release aggregator needs the build green (build-windows: $BUILD_WINDOWS_RESULT)"
            exit 1
          fi

      - name: Check out the source
        uses: actions/checkout@v4
        with:
          # The release-body generator (Scripts/release-notes.sh) walks the tags
          # and the merge history between them; the default shallow, no-tags
          # fetch has neither.
          fetch-depth: 0

      - name: Resolve the version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          else
            echo "version=0.0.0" >> "$GITHUB_ENV"
          fi

      - name: Download the macOS archive
        uses: actions/download-artifact@v4
        with:
          name: tandem-macos
          path: dist

      - name: Download the Linux archive
        uses: actions/download-artifact@v4
        with:
          name: tandem-linux
          path: dist

      - name: Download the Windows archive
        uses: actions/download-artifact@v4
        with:
          name: tandem-windows
          path: dist

      - name: "Verify: the three platform archives are present"
        run: |
          test -f "dist/tandem-$version-darwin-arm64.tar.gz"
          test -f "dist/tandem-$version-linux-x86_64.tar.gz"
          test -f "dist/tandem-$version-windows-x86_64.zip"
          ls -l dist

      - name: Stage install.sh and SHA256SUMS
        run: |
          Scripts/stage-release-assets.sh "$version" dist
          cat dist/SHA256SUMS

      - name: "Verify: the staged manifest checks out"
        run: |
          cd dist
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum -c SHA256SUMS
          else
            shasum -a 256 -c SHA256SUMS
          fi
          grep -q "DEFAULT_VERSION=\"$version\"" install.sh

      - name: Publish the GitHub release (tag runs only)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Idempotent re-cut of the same tag (user story 14): this gh build
          # (2.102.0) has no --clobber on `release create`, so an existing
          # release for the tag is deleted first, then recreated with the
          # current assets.
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release delete "$GITHUB_REF_NAME" --yes
          fi
          notes=$(Scripts/release-notes.sh "$GITHUB_REF_NAME")
          gh release create "$GITHUB_REF_NAME" \
            --title "Tandem $version" \
            --notes "$notes" \
            "dist/tandem-$version-darwin-arm64.tar.gz" \
            "dist/tandem-$version-linux-x86_64.tar.gz" \
            "dist/tandem-$version-windows-x86_64.zip" \
            dist/install.sh dist/SHA256SUMS
