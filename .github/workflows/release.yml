name: Release

# The tag run, cargo only: three standalone `tandem` archives, verified on the
# platform that built them, then published with `install.sh` and one
# `SHA256SUMS`. `Scripts/install.sh` downloads an archive, verifies its digest
# and installs the one binary; there is no Node toolchain, no Electron package
# and no Homebrew tap in the path (CUT-16, ADR 0045).
#
# Pull-request runs build and verify the same three archives and never publish,
# so a packaging change is a red check on the PR instead of a broken tag. They
# do it unless the PR touches only the allowlist `Resources/` and `LICENSE`
# (CUT-32; an allowlist of what may skip, since some gates read the whole
# tracked tree). Every job still runs and reports its name, with its steps
# skipped on such a PR, because a skipped matrix job reports under its
# unexpanded name and a required check that never reports blocks the merge. Tags
# and dispatches always run everything. The three builds are one matrix job:
# a new target is one row. The publisher keeps the job name `release`: `main` requires a status check by that
# name, and a required check that never reports blocks every merge. It waits for
# the build matrix, and its step turns a skipped or failed build into a red
# `release` (a skipped job reports success to the branch protection).
#
# The version is the tag without its `v`, or `0.0.0` on a pull request or a
# dispatch. It is stamped into the binary as `TANDEM_VERSION`, so the archive's
# own smoke test reads the same version back from `tandem --version`.
#
# No third-party action: `actions/cache` is GitHub's own, behind the local
# `rust-setup` action. This workflow has no `main` trigger, so each build uses
# the combined cache step: a PR's later pushes hit its own PR-scoped entry, and
# a tag run restores from `main` or its own scope. The tag run still rebuilds, since it stamps its own version.

on:
  push:
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

# Least privilege by default: the build jobs only read the repo. The `release`
# job needs `contents: write` for `gh release create`, and no other job gets it.
permissions:
  contents: read

# A superseded pull-request run is cancelled; tag runs and dispatches never are.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - name: Check out the merge commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Did the change touch what the build reads?
        id: filter
        run: echo "code=$(bash Scripts/changed-paths.sh Resources/ LICENSE)" >> "$GITHUB_OUTPUT"

  build:
    name: build (${{ matrix.target }})
    needs: changes
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: darwin-arm64
            ext: tar.gz
            artifact: macos
          - os: ubuntu-latest
            target: linux-x86_64
            ext: tar.gz
            artifact: linux
          - os: windows-latest
            target: windows-x86_64
            ext: zip
            artifact: windows
    steps:
      - name: Check out the source
        uses: actions/checkout@v4

      - name: Set up the Rust toolchain and cache
        uses: ./.github/actions/rust-setup
        with:
          enabled: ${{ needs.changes.outputs.code }}
          key: build-${{ matrix.artifact }}-release
          save: "true"

      - name: Resolve the version
        if: needs.changes.outputs.code == 'true'
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          else
            echo "version=0.0.0" >> "$GITHUB_ENV"
          fi

      - name: Build the binary
        if: needs.changes.outputs.code == 'true'
        shell: bash
        working-directory: rust
        run: TANDEM_VERSION="$version" cargo build --release -p tandem

      - name: Package the archive (tar.gz)
        if: needs.changes.outputs.code == 'true' && matrix.ext == 'tar.gz'
        run: |
          archive="tandem-$version-${{ matrix.target }}.tar.gz"
          staging="$RUNNER_TEMP/package"
          mkdir -p "$staging" dist
          cp rust/target/release/tandem "$staging/tandem"
          chmod +x "$staging/tandem"
          tar -czf "dist/$archive" -C "$staging" tandem
          tar -tzf "dist/$archive"

      - name: Package the archive (zip)
        if: needs.changes.outputs.code == 'true' && matrix.ext == 'zip'
        shell: pwsh
        run: |
          $archive = "tandem-$env:version-${{ matrix.target }}.zip"
          New-Item -ItemType Directory -Force -Path dist, "$env:RUNNER_TEMP\package" | Out-Null
          Copy-Item rust\target\release\tandem.exe "$env:RUNNER_TEMP\package\tandem.exe"
          Compress-Archive -Path "$env:RUNNER_TEMP\package\tandem.exe" -DestinationPath "dist\$archive"
          Get-ChildItem dist

      - name: "Smoke: the extracted tar.gz archive serves the board"
        if: needs.changes.outputs.code == 'true' && matrix.ext == 'tar.gz'
        run: |
          # Smoke the bytes the tag publishes, not the build tree: untar the
          # archive just written and run the binary a user would get. A wrong
          # member name, a lost executable bit or a mislaid layout fails here
          # rather than on someone's first install.
          smoke="$RUNNER_TEMP/smoke"
          mkdir -p "$smoke"
          tar -xzf "dist/tandem-$version-${{ matrix.target }}.tar.gz" -C "$smoke"
          test -x "$smoke/tandem"
          bash Scripts/smoke-binary.sh "$smoke/tandem" "$version"

      - name: "Smoke: the extracted zip archive serves the board"
        if: needs.changes.outputs.code == 'true' && matrix.ext == 'zip'
        shell: pwsh
        run: ./Scripts/smoke-binary.ps1 -Archive "dist\tandem-$($env:version)-${{ matrix.target }}.zip" -Version $env:version

      - name: Upload the archive
        if: needs.changes.outputs.code == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: tandem-${{ matrix.artifact }}
          path: dist

  release:
    name: release
    # The required check's name. It runs after the builds, so a release is
    # published only from a run whose three archives were verified.
    needs: [changes, build]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write # `gh release create`; no other job has it
    steps:
      - name: "Verify: the builds are green"
        env:
          BUILD_RESULT: ${{ needs.build.result }}
        run: |
          if [ "$BUILD_RESULT" != "success" ]; then
            echo "::error::the release aggregator needs the build green (build: $BUILD_RESULT)"
            exit 1
          fi

      - name: Check out the source
        if: needs.changes.outputs.code == 'true'
        uses: actions/checkout@v4
        with:
          # The release-body generator (Scripts/release-notes.sh) walks the tags
          # and the merge history between them; the default shallow, no-tags
          # fetch has neither.
          fetch-depth: 0

      - name: Resolve the version
        if: needs.changes.outputs.code == 'true'
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          else
            echo "version=0.0.0" >> "$GITHUB_ENV"
          fi

      - name: Download the three archives
        if: needs.changes.outputs.code == 'true'
        uses: actions/download-artifact@v4
        with:
          pattern: tandem-*
          merge-multiple: true
          path: dist

      - name: "Verify: the three platform archives are present"
        if: needs.changes.outputs.code == 'true'
        run: |
          test -f "dist/tandem-$version-darwin-arm64.tar.gz"
          test -f "dist/tandem-$version-linux-x86_64.tar.gz"
          test -f "dist/tandem-$version-windows-x86_64.zip"
          ls -l dist

      - name: Stage install.sh and SHA256SUMS
        if: needs.changes.outputs.code == 'true'
        run: |
          Scripts/stage-release-assets.sh "$version" dist
          cat dist/SHA256SUMS

      - name: "Verify: the staged manifest checks out"
        if: needs.changes.outputs.code == 'true'
        run: |
          cd dist
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum -c SHA256SUMS
          else
            shasum -a 256 -c SHA256SUMS
          fi
          grep -q "DEFAULT_VERSION=\"$version\"" install.sh

      - name: Publish the GitHub release (tag runs only)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Idempotent re-cut of the same tag (user story 14): this gh build
          # (2.102.0) has no --clobber on `release create`, so an existing
          # release for the tag is deleted first, then recreated with the
          # current assets.
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release delete "$GITHUB_REF_NAME" --yes
          fi
          notes=$(Scripts/release-notes.sh "$GITHUB_REF_NAME")
          gh release create "$GITHUB_REF_NAME" \
            --title "Tandem $version" \
            --notes "$notes" \
            "dist/tandem-$version-darwin-arm64.tar.gz" \
            "dist/tandem-$version-linux-x86_64.tar.gz" \
            "dist/tandem-$version-windows-x86_64.zip" \
            dist/install.sh dist/SHA256SUMS
