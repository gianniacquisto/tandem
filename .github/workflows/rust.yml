name: Rust

# The port's CI: the workspace's gates on the three platforms the port
# targets, as parallel jobs so the wall clock is the slowest one, not the sum.
#
# The checks this publishes are what `main`'s protection names:
# `fmt`, `clippy (macos-latest)`, `clippy (ubuntu-latest)`,
# `clippy (windows-latest)`, `test (macos-latest)`, `test (ubuntu-latest)`,
# `test (windows-latest)`, `contention (windows-latest)` and, from
# `release.yml`, `release`. Why each exists:
#   fmt         formatting, which is OS-independent, once.
#   clippy      per OS, because `cfg(windows)`, `cfg(unix)` and `cfg(target_os)`
#               code makes its output platform-dependent.
#   test        the full suite on every OS (`cargo test` compiles the lib, the
#               bins and the tests, so no separate build gate), plus the
#               installer suite off Windows and the retired-path scan on macOS.
#   contention  the ten-run loop over the Windows-flaky store cases.
# They have to exist on every pull request to be worth requiring: a required
# check that a path-filtered workflow never creates reads "Expected" forever and
# blocks the merge of a PR that touches no `rust/**` file. So `push` keeps its
# filter, where a skipped run costs nothing, and `pull_request` does not filter.
#
# No third-party action: `actions/checkout` and `actions/cache` are GitHub's
# own, `rust-toolchain.toml` pins the version and the two components, rustup
# ships on every hosted runner, and nothing here reads a secret or prints an
# environment. The cargo and target cache is saved only by a push to `main`;
# pull-request runs restore it and never write, so a PR cannot poison the cache
# a later `main` or tag run reads and does not fill the repository quota.

on:
  push:
    branches: [main]
    paths:
      - "rust/**"
      - ".github/workflows/rust.yml"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    working-directory: rust

jobs:
  fmt:
    name: fmt
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the source
        uses: actions/checkout@v4

      - name: Warm the toolchain proxy
        # rustup reads `rust/rust-toolchain.toml` on first proxy use and
        # installs the pinned version with `rustfmt` and `clippy`; naming it
        # here keeps the download visible and the gate steps free of setup.
        run: cargo --version

      - name: "Gate: cargo fmt --check"
        run: cargo fmt --all --check

  clippy:
    name: clippy (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    steps:
      - name: Check out the source
        uses: actions/checkout@v4

      - name: Warm the toolchain proxy
        run: cargo --version

      - name: Resolve the toolchain pin
        id: toolchain
        shell: bash
        run: |
          echo "channel=$(sed -n 's/^channel *= *"\(.*\)"/\1/p' rust-toolchain.toml)" >> "$GITHUB_OUTPUT"
          echo "lock=${{ hashFiles('rust/Cargo.lock') }}" >> "$GITHUB_OUTPUT"

      - name: Restore the cargo and target cache
        id: cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            rust/target
          key: ${{ runner.os }}-clippy-${{ steps.toolchain.outputs.channel }}-${{ steps.toolchain.outputs.lock }}
          restore-keys: |
            ${{ runner.os }}-clippy-${{ steps.toolchain.outputs.channel }}-

      - name: "Gate: cargo clippy -D warnings"
        run: cargo clippy --all-targets -- -D warnings

      - name: Save the cache (main pushes only)
        if: github.event_name == 'push' && steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            rust/target
          key: ${{ steps.cache.outputs.cache-primary-key }}

  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    steps:
      - name: Check out the source
        uses: actions/checkout@v4

      - name: Warm the toolchain proxy
        run: cargo --version

      - name: Resolve the toolchain pin
        id: toolchain
        shell: bash
        run: |
          echo "channel=$(sed -n 's/^channel *= *"\(.*\)"/\1/p' rust-toolchain.toml)" >> "$GITHUB_OUTPUT"
          echo "lock=${{ hashFiles('rust/Cargo.lock') }}" >> "$GITHUB_OUTPUT"

      - name: Restore the cargo and target cache
        id: cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            rust/target
          key: ${{ runner.os }}-test-${{ steps.toolchain.outputs.channel }}-${{ steps.toolchain.outputs.lock }}
          restore-keys: |
            ${{ runner.os }}-test-${{ steps.toolchain.outputs.channel }}-

      - name: "Gate: cargo test"
        run: cargo test

      - name: "Gate: the tree names no retired path"
        # RET-91's scan lived in `app.yml`, which CUT-15 deleted with the
        # Electron tree, and had no caller after it. Once per run: it reads the
        # tracked tree, not the platform's build, so the macOS `test` leg runs
        # it once, with the installer suite below. The third-party notice check
        # rides `cargo test` (`rust/core/tests/notice.rs`) on every leg.
        if: runner.os == 'macOS'
        working-directory: ${{ github.workspace }}
        run: bash Scripts/check-retired-paths.sh

      - name: "Gate: the installer and stager suites"
        # TAN-253 wrote the suite and nothing ran it in CI, so a change to
        # either released script waited for a tag to show. install.sh is the
        # documented download path (README.md, docs/install-paths.md) and
        # stage-release-assets.sh is the release job's staging step; TAN-320
        # wired this gate. The suite builds a fixture release over file:// and
        # drives both through their documented test seams, touching neither
        # /Applications nor the network.
        if: runner.os != 'Windows'
        working-directory: ${{ github.workspace }}
        run: bash Scripts/test_install.sh

      - name: Save the cache (main pushes only)
        if: github.event_name == 'push' && steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            rust/target
          key: ${{ steps.cache.outputs.cache-primary-key }}

  contention:
    name: contention (windows-latest)
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Check out the source
        uses: actions/checkout@v4

      - name: Warm the toolchain proxy
        run: cargo --version

      - name: Resolve the toolchain pin
        id: toolchain
        shell: bash
        run: |
          echo "channel=$(sed -n 's/^channel *= *"\(.*\)"/\1/p' rust-toolchain.toml)" >> "$GITHUB_OUTPUT"
          echo "lock=${{ hashFiles('rust/Cargo.lock') }}" >> "$GITHUB_OUTPUT"

      - name: Restore the cargo and target cache
        id: cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            rust/target
          key: ${{ runner.os }}-contention-${{ steps.toolchain.outputs.channel }}-${{ steps.toolchain.outputs.lock }}
          restore-keys: |
            ${{ runner.os }}-contention-${{ steps.toolchain.outputs.channel }}-

      - name: "Gate: the contention cases, ten times (Windows)"
        # These are the cases that flaked on this runner: run 41080330208
        # (`concurrent_writers_keep_every_row`) and run 41099651828
        # (`a_concurrent_edit_is_not_reverted_by_another_writers_snapshot`,
        # which answered `Locked`) on the store's old sidecar window, and
        # `two_writers_over_one_home_keep_every_row_and_issue_every_ref_once`
        # (TAN-252: `board.rs:354` answered `Locked` on #291, #302 and the
        # docs-only #292 with no Rust in the diff), plus PRT-37's
        # `two_writers_on_threads_interleave_without_lost_or_torn_notes` on the
        # bikeshed's bounded lock. PRT-23 removed the store's sidecar and
        # serialized this process's writers on a home-keyed gate; PRT-37 gave
        # the store-level contention cases their own wider window (the
        # production 2 s constants are untouched), and TAN-252 retries the
        # board-level writers through `write_after_lock`, so a turn-away costs
        # a retry instead of a red. Ten runs in one job are the evidence, and a
        # failure here is a red gate, not a re-run to notice.
        #
        # Each run asserts that exactly one test ran: `--exact` with a renamed
        # case exits 0 after `running 0 tests`, and a done-when that silently
        # stops testing is worse than a red one.
        run: |
          for ($run = 1; $run -le 10; $run++) {
            $out = cargo test -p tandem-core --lib -- store::tests::writes::concurrent_writers_keep_every_row --exact 2>&1
            $out | Write-Output
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            if (-not ($out -match 'test result: ok\. 1 passed')) {
              Write-Error "run ${run}: concurrent_writers_keep_every_row ran no test; a renamed case would pass silently"
              exit 1
            }
            $out = cargo test -p tandem-core --lib -- tests::bikeshed_locking::two_writers_on_threads_interleave_without_lost_or_torn_notes --exact 2>&1
            $out | Write-Output
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            if (-not ($out -match 'test result: ok\. 1 passed')) {
              Write-Error "run ${run}: two_writers_on_threads_interleave_without_lost_or_torn_notes ran no test; a renamed case would pass silently"
              exit 1
            }
            $out = cargo test -p tandem-core --test board -- a_concurrent_edit_is_not_reverted_by_another_writers_snapshot --exact 2>&1
            $out | Write-Output
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            if (-not ($out -match 'test result: ok\. 1 passed')) {
              Write-Error "run ${run}: a_concurrent_edit_is_not_reverted_by_another_writers_snapshot ran no test; a renamed case would pass silently"
              exit 1
            }
            $out = cargo test -p tandem-core --test board -- two_writers_over_one_home_keep_every_row_and_issue_every_ref_once --exact 2>&1
            $out | Write-Output
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            if (-not ($out -match 'test result: ok\. 1 passed')) {
              Write-Error "run ${run}: two_writers_over_one_home_keep_every_row_and_issue_every_ref_once ran no test; a renamed case would pass silently"
              exit 1
            }
          }

      - name: Save the cache (main pushes only)
        if: github.event_name == 'push' && steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            rust/target
          key: ${{ steps.cache.outputs.cache-primary-key }}
