name: Rust

# The port's CI: the workspace's gates on the three platforms the port
# targets, as parallel jobs so the wall clock is the slowest one, not the sum.
#
# The checks this publishes are what `main`'s protection names:
# `fmt`, `clippy (macos-latest)`, `clippy (ubuntu-latest)`,
# `clippy (windows-latest)`, `test (macos-latest)`, `test (ubuntu-latest)`,
# `test (windows-latest)`, `contention (windows-latest)` and, from
# `release.yml`, `release`. Why each exists:
#   fmt         formatting, which is OS-independent, once.
#   clippy      per OS, because `cfg(windows)`, `cfg(unix)` and `cfg(target_os)`
#               code makes its output platform-dependent.
#   test        the full suite on every OS (`cargo test` compiles the lib, the
#               bins and the tests, so no separate build gate), plus the
#               installer suite off Windows and the retired-path scan and the em-dash diff gate on macOS.
#   contention  the ten-run loop over the Windows-flaky store cases.
# They have to report on every pull request to be worth requiring: a required
# check that a path-filtered workflow never creates reads "Expected" forever
# and blocks the merge of a PR that touches no `rust/**` file, and a matrix
# job skipped by `if` reports under its unexpanded name, so `clippy (macos-
# latest)` would still never appear. So the workflow has no `pull_request`
# path filter (CUT-32): a small `changes` job decides, every job still runs
# and reports its name, and the steps that call cargo are skipped when the
# pull request touches only paths on a short allowlist (`Resources/`,
# `LICENSE`). It is an allowlist of what may skip, not a list of what runs,
# because some gates read the whole tracked tree (the retired-path scan, the
# label-vocabulary test, the notice test): a path nobody listed runs the
# gates. A skipped step is a success, so the required check passes with no
# cargo invocation. `push` keeps the same allowlist as `paths-ignore`, where a
# skipped run costs nothing.
#
# Every action is pinned to a full commit SHA (Dependabot keeps them current).
# `actions/checkout` and `actions/cache` are GitHub's own (the cache behind the
# local `rust-setup` action), `deny` is the one third-party action,
# `rust-toolchain.toml` pins the version and the two components, rustup ships
# on every hosted runner, and nothing here reads a secret or prints an
# environment. The cargo and target cache is saved only by a push to `main`;
# pull-request runs restore it and never write, so a PR cannot poison the cache
# a later `main` or tag run reads and does not fill the repository quota.

on:
  push:
    branches: [main]
    paths-ignore:
      - "Resources/**"
      - "LICENSE"
  pull_request:
  # The advisory audit alone runs weekly, so a new advisory is found without a
  # push; every other job skips on this event.
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    working-directory: rust

jobs:
  changes:
    name: changes
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: .
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - name: Check out the merge commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Did the change touch what the gates read?
        id: filter
        run: echo "code=$(bash Scripts/changed-paths.sh Resources/ LICENSE)" >> "$GITHUB_OUTPUT"

  deny:
    name: deny
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: "Gate: cargo deny check (advisories, licences, bans, sources)"
        uses: EmbarkStudios/cargo-deny-action@70f81531115945ba6eb6b941ec9d39d063438eb9 # v2
        with:
          manifest-path: rust/Cargo.toml
          command: check advisories licenses bans sources

  fmt:
    name: fmt
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up the Rust toolchain and cache
        id: setup
        uses: ./.github/actions/rust-setup
        with:
          enabled: ${{ needs.changes.outputs.code }}
          key: fmt

      - name: "Gate: cargo fmt --check"
        if: needs.changes.outputs.code != 'false'
        run: cargo fmt --all --check

  clippy:
    name: clippy (${{ matrix.os }})
    needs: changes
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    steps:
      - name: Check out the source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up the Rust toolchain and cache
        id: setup
        uses: ./.github/actions/rust-setup
        with:
          enabled: ${{ needs.changes.outputs.code }}
          key: clippy

      - name: "Gate: cargo clippy -D warnings"
        if: needs.changes.outputs.code != 'false'
        run: cargo clippy --all-targets -- -D warnings

      - name: Save the cache (main pushes only)
        if: github.event_name == 'push' && steps.setup.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            rust/target
          key: ${{ steps.setup.outputs.cache-primary-key }}

  test:
    name: test (${{ matrix.os }})
    needs: changes
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    steps:
      - name: Check out the source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # TAN-357: the em-dash gate diffs HEAD^1..HEAD of the merge commit.
          fetch-depth: 2

      - name: Set up the Rust toolchain and cache
        id: setup
        uses: ./.github/actions/rust-setup
        with:
          enabled: ${{ needs.changes.outputs.code }}
          key: test

      - name: "Gate: cargo test"
        if: needs.changes.outputs.code != 'false'
        run: cargo test

      - name: "Gate: the tree names no retired path"
        # RET-91's scan lived in `app.yml`, which CUT-15 deleted with the
        # Electron tree, and had no caller after it. Once per run: it reads the
        # tracked tree, not the platform's build, so the macOS `test` leg runs
        # it once, with the installer suite below. The third-party notice check
        # rides `cargo test` (`rust/core/tests/notice.rs`) on every leg.
        if: needs.changes.outputs.code != 'false' && runner.os == 'macOS'
        working-directory: ${{ github.workspace }}
        run: bash Scripts/check-retired-paths.sh

      - name: "Gate: no added line carries an em dash"
        # TAN-357: AGENTS.md bans U+2014 in what an agent writes. It reads the
        # diff, not the platform build, so the macOS leg runs it once.
        if: needs.changes.outputs.code != 'false' && runner.os == 'macOS'
        working-directory: ${{ github.workspace }}
        run: |
          bash Scripts/test_check_prose_dash.sh
          bash Scripts/check-prose-dash.sh

      - name: "Gate: the installer and stager suites"
        # TAN-253 wrote the suite and nothing ran it in CI, so a change to
        # either released script waited for a tag to show. install.sh is the
        # documented download path (README.md, docs/install-paths.md) and
        # stage-release-assets.sh is the release job's staging step; TAN-320
        # wired this gate. The suite builds a fixture release over file:// and
        # drives both through their documented test seams, touching neither
        # /Applications nor the network.
        if: needs.changes.outputs.code != 'false' && runner.os != 'Windows'
        working-directory: ${{ github.workspace }}
        run: bash Scripts/test_install.sh

      - name: Save the cache (main pushes only)
        if: github.event_name == 'push' && steps.setup.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            rust/target
          key: ${{ steps.setup.outputs.cache-primary-key }}

  contention:
    name: contention (windows-latest)
    needs: changes
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Check out the source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up the Rust toolchain and cache
        id: setup
        uses: ./.github/actions/rust-setup
        with:
          enabled: ${{ needs.changes.outputs.code }}
          key: contention

      - name: "Gate: the contention cases, ten times (Windows)"
        # These are the cases that flaked on this runner: run 41080330208
        # (`concurrent_writers_keep_every_row`) and run 41099651828
        # (`a_concurrent_edit_is_not_reverted_by_another_writers_snapshot`,
        # which answered `Locked`) on the store's old sidecar window, and
        # `two_writers_over_one_home_keep_every_row_and_issue_every_ref_once`
        # (TAN-252: `board.rs:354` answered `Locked` on #291, #302 and the
        # docs-only #292 with no Rust in the diff), plus PRT-37's
        # `two_writers_on_threads_interleave_without_lost_or_torn_notes` on the
        # notes' bounded lock. PRT-23 removed the store's sidecar and
        # serialized this process's writers on a home-keyed gate; PRT-37 gave
        # the store-level contention cases their own wider window (the
        # production 2 s constants are untouched), and TAN-252 retries the
        # board-level writers through `write_after_lock`, so a turn-away costs
        # a retry instead of a red. Ten runs in one job are the evidence, and a
        # failure here is a red gate, not a re-run to notice.
        #
        # Each run asserts that exactly one test ran: `--exact` with a renamed
        # case exits 0 after `running 0 tests`, and a done-when that silently
        # stops testing is worse than a red one.
        if: needs.changes.outputs.code != 'false' && runner.os == 'Windows'
        run: |
          $cases = @(
            @{ Name = 'concurrent_writers_keep_every_row'; Args = @('-p', 'tandem-core', '--lib', '--', 'store::tests::writes::concurrent_writers_keep_every_row', '--exact') }
            @{ Name = 'two_writers_on_threads_interleave_without_lost_or_torn_notes'; Args = @('-p', 'tandem-core', '--lib', '--', 'tests::notes_locking::two_writers_on_threads_interleave_without_lost_or_torn_notes', '--exact') }
            @{ Name = 'a_concurrent_edit_is_not_reverted_by_another_writers_snapshot'; Args = @('-p', 'tandem-core', '--test', 'board', '--', 'a_concurrent_edit_is_not_reverted_by_another_writers_snapshot', '--exact') }
            @{ Name = 'two_writers_over_one_home_keep_every_row_and_issue_every_ref_once'; Args = @('-p', 'tandem-core', '--test', 'board', '--', 'two_writers_over_one_home_keep_every_row_and_issue_every_ref_once', '--exact') }
          )
          for ($run = 1; $run -le 10; $run++) {
            foreach ($case in $cases) {
              $cargoArgs = $case.Args
              $out = cargo test @cargoArgs 2>&1
              $out | Write-Output
              if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
              if (-not ($out -match 'test result: ok\. 1 passed')) {
                Write-Error "run ${run}: $($case.Name) ran no test; a renamed case would pass silently"
                exit 1
              }
            }
          }

      - name: Save the cache (main pushes only)
        if: github.event_name == 'push' && steps.setup.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            rust/target
          key: ${{ steps.setup.outputs.cache-primary-key }}
