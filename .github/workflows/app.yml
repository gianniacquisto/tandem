name: App

# The shell's gates on the three platforms the port targets, plus one
# packaging run per platform, plus the screenshot suite on Linux. The packaging
# step builds the Rust core into the artifact, and two gates check it: the
# binary sits where the packaged shell resolves it, and (on macOS and Linux) the
# packaged app answers `ticket.list` against a fixture home. The checks this
# publishes are what a branch rule may name: `app (macos-latest)`,
# `app (ubuntu-latest)`, `app (windows-latest)` and `shots (ubuntu-latest)`.
#
# `push` is path-filtered, where a skipped run costs nothing; `pull_request` is
# not, because a required check a path-filtered workflow never creates reads
# "Expected" forever and blocks a PR that touches no `app/**` file. Same shape
# as `rust.yml`.
#
# No secret and no signing identity: the artifacts are unsigned on all three
# platforms, which is the ticket's decided-against. electron-builder downloads
# the platform's Electron and its own tooling on each runner.

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - ".github/workflows/app.yml"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    working-directory: app

jobs:
  app:
    name: app (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    steps:
      - name: Check out the source
        uses: actions/checkout@v4

      - name: Use Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            app/package-lock.json
            Editor/package-lock.json

      - name: Warm the Rust toolchain
        # The artifact carries the core it runs (below). The proxy reads
        # `rust/rust-toolchain.toml` on first use and installs the version
        # `rust.yml` pins, so the packaged binary is built by the same
        # toolchain CI tests.
        working-directory: rust
        run: cargo --version

      - name: Install
        run: npm ci

      - name: "Gate: typecheck"
        run: npm run typecheck

      - name: "Gate: test"
        run: npm test

      - name: "Gate: build"
        run: npm run build

      - name: "Gate: editor bundle tests + reproducible build"
        # The editor bundle is committed at `app/renderer/public/editor` and is
        # built from `Editor/`. The pinned inputs must regenerate those bytes
        # exactly: a test passes, and a non-empty diff after the rebuild is a
        # hand edit or a source/lockfile drift, which this step makes red.
        if: runner.os == 'macOS'
        working-directory: Editor
        run: |
          npm ci
          node --test
          npm run build

      - name: "Gate: the committed editor bundle is current"
        if: runner.os == 'macOS'
        run: git diff --exit-code -- app/renderer/public/editor

      - name: Build the core the artifact carries
        run: npm run binary:release

      - name: "Gate: package"
        env:
          # electron-builder skips signing on pull-request builds unless this
          # is set. The signature is ad-hoc and reads no secret (PRT-36), so
          # the warning's fork-risk does not apply.
          CSC_FOR_PULL_REQUEST: "true"
        run: npm run dist

      - name: "Gate: the artifact carries the tandem binary"
        # The path `src/main/binary.ts` resolves in a packaged app, checked on
        # every platform: a missing binary cannot ship silently.
        run: npm run check:artifact

      - name: "Gate: the packaged app answers ticket.list"
        # What the check above cannot prove: that the binary runs and the app
        # answers against a fixture home, with the workspace build unreachable.
        # Linux runners have no display, so the app runs under Xvfb.
        if: runner.os != 'Windows'
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            xvfb-run -a npm run smoke
          else
            npm run smoke
          fi

      - name: Upload the platform's artifact
        uses: actions/upload-artifact@v4
        with:
          name: tandem-${{ matrix.os }}
          path: |
            app/dist/*.dmg
            app/dist/*.AppImage
            app/dist/*.exe
          if-no-files-found: error

  # The one screenshot rig, and the same job: a browser instead of an lldb
  # injection. Linux only, because a display there is one command (`xvfb-run`). The run writes the PNGs and the catalogue into the
  # runner's checkout, which is the point: the job is the spec's verdict on the
  # pictures a developer's machine commits. The core is built first because the
  # specs drive the real shell over `rpc`, so the binary is the subject and not
  # a stub.
  shots:
    name: shots (ubuntu-latest)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out the source
        uses: actions/checkout@v4

      - name: Use Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            app/package-lock.json
            Editor/package-lock.json

      - name: Build the core
        working-directory: rust
        run: cargo build -p tandem

      - name: Install
        run: npm ci

      - name: Install the window's system libraries
        run: npx playwright install-deps chromium

      - name: "Gate: the screenshot suite"
        run: xvfb-run -a npm run shots
        env:
          TANDEM_SHOTS_HOME: ../Fixtures/port/Home

      - name: Keep what a failed run left
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: shot-run
          path: |
            app/test-results
            app/playwright-report
          if-no-files-found: ignore
