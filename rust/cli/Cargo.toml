[package]
name = "tandem"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Tandem's agent face: the verbs the skills speak and, later, rpc."

[[bin]]
name = "tandem"
path = "src/main.rs"

[dependencies]
askama.workspace = true
axum.workspace = true
clap.workspace = true
serde.workspace = true
serde_json.workspace = true
tandem-core.workspace = true
# `tandem serve` owns the process's runtime and listener; the core owns the
# router, the watcher and the templates (ADR 0046).
tokio.workspace = true
# A capture's generated session folder, when the host exports no id (PRT-9).
uuid.workspace = true
