# The port's workspace. Two crates, deliberately: `core` owns the domain, the
# store adapter and the wire, `cli` owns the process (argv, stdin, stdout).
# They are separate so the wire shapes cannot grow a dependency on a verb's
# argument parsing (`docs/port.md`, Where the old code goes).
#
# The dependency set is the spec's (`docs/port.md`, Stack). A crate lands here
# with a reason in the PR, never by convenience.

[workspace]
members = ["core", "cli"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/gianniacquisto/tandem"

[workspace.dependencies]
tandem-core = { path = "core" }

# `bundled`: one SQLite on every platform, compiled from the crate, no distro
# library (PRT-4).
rusqlite = { version = "0.41", features = ["bundled"] }
# GFM closest to the `cmark-gfm` the Swift core uses (PRT-7).
comrak = "0.59"
clap = { version = "4.6", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
# Note content hashes (PRT-7).
sha2 = "0.11"
# TypeScript declarations generated from the same structs (PRT-12).
ts-rs = "12.0"
