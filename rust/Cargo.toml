# The workspace. Two crates, deliberately: `core` owns the domain, the
# store adapter and the wire, `cli` owns the process (argv, stdin, stdout).
# They are separate so the wire shapes cannot grow a dependency on a verb's
# argument parsing.
#
# The dependency set is kept small. A crate lands here
# with a reason in the PR, never by convenience.

[workspace]
members = ["core", "cli"]
resolver = "3"

[workspace.package]
version = "2.0.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/gianniacquisto/tandem"

[workspace.dependencies]
tandem-core = { path = "core" }

# `bundled`: one SQLite on every platform, compiled from the crate, no distro
# library. `backup`: the rolling backup is one complete generation
# through the engine's own API, never a half-copied file (ADR 0018).
rusqlite = { version = "0.41", features = ["bundled", "backup"] }
# GFM, the dialect `cmark-gfm` speaks.
comrak = "0.59"
clap = { version = "4.6", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
# Note content hashes.
sha2 = "0.11"
# Ticket ids are UUIDs, and the
# store keys its rows by that text. `v4` is the generator a new ticket
# needs; parsing and rendering are the same crate's.
# The browser session id: 32 bytes straight from the operating system's generator.
getrandom = "0.4"
uuid = { version = "1.29", features = ["v4"] }
# `access(2)` is the writability probe `setup`'s `unwritable` warning makes, and
# `getxattr` is `doctor`'s quarantine test. Both are libc calls the
# standard library does not expose; the crate is already in the lock file as
# `rusqlite`'s transitive dependency. Unix only: Windows has no portable
# equivalent, and the probe there assumes a present path is writable.
libc = "0.2"
# `tandem serve`: one loopback HTTP server in the one binary (ADR 0046). axum
# owns the routing and the response shapes, tokio the runtime the listener and
# the SSE stream run on, and askama compiles the board templates into the core.
axum = { version = "0.8", features = ["form"] }
tokio = { version = "1", features = [
    "rt-multi-thread",
    "net",
    "sync",
    "time",
    "macros",
    "signal",
] }
askama = "0.16"
# The SSE route forwards a `tokio::sync::broadcast` channel as a stream; the
# wrapper is the one adapter between the two, no server logic of its own.
tokio-stream = { version = "0.1", features = ["sync", "time"] }
# The board's forms are `application/x-www-form-urlencoded`; the dismiss link
# is built with the same encoder the extractor reads.
serde_urlencoded = "0.7"
# The in-process router tests drive a `Router` as a `tower` service and collect
# its body; both are axum's own transitive dependencies, named here because the
# test names them directly.
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
# `tandem serve`'s application log (ADR 0046 amendment): the macros the core
# emits through, and the subscriber the cli installs. The subscriber carries
# only the features the log needs, no appender, no time crate.
tracing = "0.1"
tracing-subscriber = { version = "0.3.20", default-features = false, features = [
    "std",
    "fmt",
    "ansi",
    "env-filter",
] }
# The remote CLI (ADR 0047): `TANDEM_SERVER` sends each verb to a `tandem serve`
# as one `POST /mcp`. A blocking client with TLS (rustls) is the whole need, since
# a bearer token has no safe use over plain HTTP off loopback; the redirect
# follow is switched off in code so the token is never forwarded.
ureq = { version = "3", default-features = false, features = ["rustls"] }
# `tandem-cli export` and `import` (ADR 0050): the home leaves and arrives as one
# `.tar.gz`. `tar` writes and reads the entries as a stream (no archive is ever
# built in memory, and the reader hands every entry's type to the importer's
# own checks), `flate2` is the gzip layer under it; tar.gz opens with stock
# tools on macOS, Linux and Windows. Both are pure Rust (flate2 on its
# default miniz_oxide backend), so no system library joins the build.
tar = { version = "0.4", default-features = false }
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
