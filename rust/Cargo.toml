# The port's workspace. Two crates, deliberately: `core` owns the domain, the
# store adapter and the wire, `cli` owns the process (argv, stdin, stdout).
# They are separate so the wire shapes cannot grow a dependency on a verb's
# argument parsing (`docs/port.md`, Where the old code goes).
#
# The dependency set is the spec's (`docs/port.md`, Stack). A crate lands here
# with a reason in the PR, never by convenience.

[workspace]
members = ["core", "cli"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/gianniacquisto/tandem"

[workspace.dependencies]
tandem-core = { path = "core" }

# `bundled`: one SQLite on every platform, compiled from the crate, no distro
# library (PRT-4). `backup`: the rolling backup is one complete generation
# through the engine's own API, never a half-copied file (ADR 0018).
rusqlite = { version = "0.41", features = ["bundled", "backup"] }
# GFM closest to the `cmark-gfm` the Swift core uses (PRT-7).
comrak = "0.59"
clap = { version = "4.6", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
# Note content hashes (PRT-7).
sha2 = "0.11"
# Ticket ids are UUIDs (the `Ticket.id` the Swift core has always had), and the
# store keys its rows by that text (PRT-5). `v4` is the generator a new ticket
# needs; parsing and rendering are the same crate's.
uuid = { version = "1.29", features = ["v4"] }
# `access(2)` is the writability probe `setup`'s `unwritable` warning makes, and
# `getxattr` is `doctor`'s quarantine test (PRT-10). Both are libc calls the
# standard library does not expose; the crate is already in the lock file as
# `rusqlite`'s transitive dependency. Unix only: Windows has no portable
# equivalent, and the probe there assumes a present path is writable.
libc = "0.2"
# `tandem serve`: one loopback HTTP server in the one binary (ADR 0046). axum
# owns the routing and the response shapes, tokio the runtime the listener and
# the SSE stream run on, and askama compiles the board templates into the core.
axum = { version = "0.8", features = ["form"] }
tokio = { version = "1", features = [
    "rt-multi-thread",
    "net",
    "sync",
    "time",
    "macros",
    "signal",
] }
askama = "0.16"
# The SSE route forwards a `tokio::sync::broadcast` channel as a stream; the
# wrapper is the one adapter between the two, no server logic of its own.
tokio-stream = { version = "0.1", features = ["sync"] }
# The board's forms are `application/x-www-form-urlencoded`; the dismiss link
# is built with the same encoder the extractor reads.
serde_urlencoded = "0.7"
# The in-process router tests drive a `Router` as a `tower` service and collect
# its body; both are axum's own transitive dependencies, named here because the
# test names them directly.
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
