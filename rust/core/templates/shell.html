<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Tandem</title>
    <link rel="stylesheet" href="/static/tokens.css">
    <link rel="stylesheet" href="/static/app.css">
    <script src="/static/htmx.min.js" defer></script>
    <script src="/static/sse.js" defer></script>
    <script src="/static/tandem.js" defer></script>
  </head>
  <body class="shell" hx-ext="sse" sse-connect="/events">
    <header class="shell__header">
      <h1 class="shell__wordmark">Tandem</h1>
      <nav class="shell__tabs" aria-label="Faces">
        <a class="shell__tab" href="/board" hx-get="/board" hx-target="#board-root" hx-swap="outerHTML">Board</a>
        <a class="shell__tab" href="/notes">Notes</a>
      </nav>
    </header>
    <main class="shell__body shell__body--bleed">
      {{ body }}
    </main>
  </body>
</html>
