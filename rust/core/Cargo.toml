[package]
name = "tandem-core"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Tandem's domain, store adapter and wire."

[lib]
name = "tandem_core"

[dependencies]
comrak.workspace = true
rusqlite.workspace = true
serde.workspace = true
# The record's two stored JSON columns (the ticket list and the skill counts)
# and the harness read's message data: the same JSON the wire speaks, parsed in
# the core so a corrupt column fails at its reader (PRT-6).
serde_json.workspace = true
sha2.workspace = true
ts-rs.workspace = true
uuid.workspace = true

[target.'cfg(unix)'.dependencies]
# `access(2)` and `getxattr`: the two probes the standard library does not
# expose (PRT-10).
libc.workspace = true

[dev-dependencies]
# The busy-path suite holds the database exclusively the way another process
# would, which only the engine's own handle can do (PRT-5).
rusqlite.workspace = true
uuid.workspace = true
