<!doctype html>
<!--
  Tandem bikeshed editor page (ticket 07) — the whole editor surface:
  one HTML page, one JS bundle (editor.js), one CSS file (style.css) +
  the KaTeX woff2 font assets under fonts/.

  Loaded by the Bikeshed face in a same-origin sandboxed iframe (spec:
  Editor — Packaging; no web workers, so file:// works). The page has no
  network access: no fetch/XHR/WebSocket/file: reads from JS — the document
  and the bikeshed index cross the bridge (notes/bridge-contract.md):

    shell → JS   setDocument / insertText / revealLine / setNoteIndex / setFontSize / focusEditor
    JS → shell   loaded / dirty / link-opened / checkbox-toggled / font-size
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Tandem</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <!-- The CM6 entry (editor.js) self-mounts into this container. The
         shell sets data-theme="day" | "night" on <html> so the pane matches
         the window chrome. -->
    <div id="tandem-editor"></div>
    <script src="editor.js"></script>
  </body>
</html>
